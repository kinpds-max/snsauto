<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAMOM YouTube Manager</title><script src="https://accounts.google.com/gsi/client" async defer></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,'Noto Sans KR',sans-serif}.wrap{max-width:1450px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.card{background:#fff;border:1px solid #e4e9f0;border-radius:16px;padding:16px;margin-top:14px}.status{padding:11px 14px;border-radius:10px;background:#fff6e9;margin-top:14px}.ok{background:#eaf9f2}.err{background:#fff0f0}.tabs,.row{display:flex;gap:8px;flex-wrap:wrap}.tab.on,.orange{background:#ff7a00}button{border:0;border-radius:10px;padding:10px 14px;background:#102b50;color:white;font-weight:700;cursor:pointer}button.light{background:#fff;color:#172033;border:1px solid #dfe5ed}input,select,textarea{width:100%;padding:10px;border:1px solid #dfe5ed;border-radius:9px;font:inherit}textarea{min-height:90px}.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dn{text-align:center;font-size:12px;font-weight:700;color:#758096}.day{min-height:95px;border:1px solid #dfe5ed;border-radius:9px;padding:6px;background:#fff}.ev{font-size:10px;background:#fff4e8;padding:4px;border-radius:6px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.small{font-size:12px;color:#758096}.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kpi>div{background:#f8fafc;border:1px solid #dfe5ed;border-radius:10px;padding:10px}.kpi b{display:block;font-size:18px}.badge{display:inline-block;background:#eef3f8;border-radius:999px;padding:3px 7px;margin:2px;font-size:11px}@media(max-width:950px){.layout,.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="wrap"><div class="top"><div><h1 style="margin:0">HAMOM YouTube Manager</h1><div class="small">GitHub → Vercel 자동배포 · 채널별 관리 · 예약 업로드</div></div><div class="row"><button class="light" onclick="origin()">Origin 확인</button><button onclick="connect()">Google / YouTube 연결</button><button class="orange" onclick="learn()">최근 영상 학습</button></div></div><div id="status" class="status">Client ID를 저장한 뒤 YouTube를 연결하세요.</div><div class="card"><div id="tabs" class="tabs"></div></div><div class="layout"><div><div class="card"><div class="top"><div class="row"><button class="light" onclick="mv(-1)">◀</button><button class="light" onclick="today()">오늘</button><button class="light" onclick="mv(1)">▶</button></div><h3 id="mt" style="margin:0"></h3></div><div id="cal" class="cal"></div></div><div class="card"><h3>콘텐츠 등록 / 예약 업로드</h3><div class="grid"><div><label>채널</label><select id="channel"></select></div><div><label>영상</label><input id="video" type="file" accept="video/*"></div><div><label>날짜</label><input id="date" type="date"></div><div><label>시간</label><input id="time" type="time" value="18:00"></div><div><label>공개 방식</label><select id="privacy"><option value="scheduled">예약 공개</option><option value="private">비공개</option><option value="unlisted">일부공개</option><option value="public">즉시 공개</option></select></div><div><label>카테고리</label><select id="cat"><option value="22">인물/블로그</option><option value="2">자동차</option><option value="27">교육</option><option value="28">과학/기술</option></select></div><div class="full"><label>주제</label><input id="topic" placeholder="예: 2026 국산차 판매순위 TOP10"></div><div class="full"><label>제목</label><input id="title" maxlength="100"></div><div class="full"><label>설명</label><textarea id="desc"></textarea></div><div class="full"><label>태그</label><textarea id="tags"></textarea></div><div><label>썸네일</label><input id="thumb" type="file" accept="image/*"></div><div><button class="light" onclick="meta()">학습기반 메타 생성</button></div><div><button class="light" onclick="saveLocal()">캘린더 저장</button></div><div class="full"><button class="orange" onclick="upload()">YouTube 실제 업로드 / 예약등록</button></div></div><div id="prog" class="small" style="margin-top:8px"></div></div></div><div><div class="card"><h3>API 설정</h3><label>Google OAuth Client ID</label><input id="cid" placeholder="xxxxxxxx.apps.googleusercontent.com"><div class="row" style="margin-top:8px"><button onclick="saveCid()">Client ID 저장</button><button class="light" onclick="clearCid()">초기화</button></div><div id="org" class="small" style="margin-top:8px"></div></div><div class="card"><h3>연결된 YouTube 채널</h3><div id="info" class="small">미연결</div><div class="kpi" style="margin-top:10px"><div>구독자<b id="sub">-</b></div><div>영상수<b id="vc">-</b></div><div>조회수<b id="views">-</b></div><div>일정<b id="ec">0</b></div></div></div><div class="card"><h3>채널 학습</h3><div id="learning" class="small">아직 학습하지 않았습니다.</div></div><div class="card"><h3>백업 / 복원</h3><div class="row"><button class="light" onclick="backup()">JSON 백업</button><button class="light" onclick="document.getElementById('restore').click()">JSON 복원</button></div><input id="restore" type="file" accept="application/json" style="display:none" onchange="restoreData(event)"></div></div></div></div><script>const CH=['하맘자동차마케팅','하맘부동산마케팅','데오럭스','대학합격의길','하맘스튜디오'];const DEF={'하맘자동차마케팅':['| 자동차 핵심정보',"자동차 핵심정보를 정리합니다.\n문의: 카카오톡 '하맘'",'자동차,신차,국산차,수입차,하맘자동차마케팅','2'],'하맘부동산마케팅':['| 부동산 핵심정리',"부동산 시장과 실거래 핵심정보를 정리합니다.\n문의: 카카오톡 '하맘'",'부동산,아파트,실거래가,하맘부동산마케팅','22'],'데오럭스':['| 입시 핵심포인트',"대치동 입시컨설팅 데오럭스\n입시문의: 카카오톡 '데오럭스'\n컨텐츠 문의: 카카오톡 '하맘'",'데오럭스,입시컨설팅,수시,정시,면접','27'],'대학합격의길':['| 대학입시 핵심정리',"대학입시 핵심정보를 정리합니다.\n입시문의: 카카오톡 '데오럭스'",'대학합격의길,대학입시,수시,정시','27'],'하맘스튜디오':['| AI 콘텐츠',"AI 영상과 콘텐츠 제작 정보를 소개합니다.\n컨텐츠 문의: 카카오톡 '하맘'",'AI영상,AI콘텐츠,영상제작,하맘스튜디오','28']};let active=CH[0],viewDate=new Date(),token='',tokenClient=null,yt=null;const $=x=>document.getElementById(x),K=x=>'hamom_'+x,R=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},W=(k,v)=>localStorage.setItem(k,JSON.stringify(v));function setStatus(t,c=''){status.textContent=t;status.className='status '+c}function init(){cid.value=localStorage.getItem(K('cid'))||'';date.value=ds(new Date());renderTabs();renderCal();renderLearning()}function renderTabs(){tabs.innerHTML='';channel.innerHTML='';CH.forEach(c=>{let b=document.createElement('button');b.textContent=c;b.className='tab '+(c===active?'on':'');b.onclick=()=>{active=c;renderTabs();renderCal();renderLearning()};tabs.appendChild(b);let o=document.createElement('option');o.value=o.textContent=c;channel.appendChild(o)});channel.value=active}function saveCid(){let v=cid.value.trim();if(!v)return alert('Client ID를 입력하세요.');localStorage.setItem(K('cid'),v);setStatus('Client ID 저장 완료','ok')}function clearCid(){localStorage.removeItem(K('cid'));cid.value=''}function origin(){org.textContent='현재 Origin: '+location.origin}function connect(){let c=cid.value.trim();if(!c)return alert('Client ID를 먼저 저장하세요.');if(!window.google?.accounts?.oauth2)return alert('Google 모듈 로딩 중입니다.');tokenClient=google.accounts.oauth2.initTokenClient({client_id:c,scope:'https://www.googleapis.com/auth/youtube https://www.googleapis.com/auth/youtube.upload https://www.googleapis.com/auth/youtube.readonly',callback:async r=>{if(r.error)return setStatus('인증 실패: '+r.error,'err');token=r.access_token;await loadYT()}});tokenClient.requestAccessToken({prompt:'consent'})}async function api(u,o={}){o.headers=Object.assign({},o.headers||{},token?{Authorization:'Bearer '+token}:{});let r=await fetch(u,o),t=await r.text(),j={};try{j=JSON.parse(t)}catch{}if(!r.ok)throw Error(j.error?.message||t||'API 오류');return j}async function loadYT(){try{let j=await api('https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics,contentDetails&mine=true');yt=j.items?.[0];if(!yt)throw Error('채널을 찾지 못했습니다.');info.innerHTML='<b>'+yt.snippet.title+'</b><br>'+yt.id;sub.textContent=n(yt.statistics.subscriberCount);vc.textContent=n(yt.statistics.videoCount);views.textContent=n(yt.statistics.viewCount);setStatus('YouTube 연결 완료: '+yt.snippet.title,'ok')}catch(e){setStatus('연결 실패: '+e.message,'err')}}async function learn(){if(!token||!yt)return alert('먼저 YouTube 연결');try{let pl=yt.contentDetails.relatedPlaylists.uploads,p=await api('https://www.googleapis.com/youtube/v3/playlistItems?part=contentDetails&maxResults=50&playlistId='+pl),ids=p.items.map(x=>x.contentDetails.videoId),v=await api('https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&id='+ids.join(',')),vs=v.items.map(x=>({title:x.snippet.title,views:+(x.statistics.viewCount||0),tags:x.snippet.tags||[]})),top=[...vs].sort((a,b)=>b.views-a.views).slice(0,10),wm={},tm={};top.forEach(x=>{(x.title.match(/[가-힣A-Za-z0-9]+/g)||[]).forEach(w=>{if(w.length>1)wm[w]=(wm[w]||0)+1});x.tags.forEach(t=>tm[t]=(tm[t]||0)+1)});let data={sample:vs.length,kw:Object.entries(wm).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]),tg:Object.entries(tm).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]),top:top.slice(0,5)},all=R(K('learning'),{});all[active]=data;W(K('learning'),all);renderLearning();setStatus('최근 영상 '+vs.length+'개 학습 완료','ok')}catch(e){setStatus('학습 실패: '+e.message,'err')}}function renderLearning(){let l=R(K('learning'),{})[active];if(!l)return learning.textContent='아직 학습하지 않았습니다.';learning.innerHTML='학습 '+l.sample+'개<br><b>키워드:</b> '+l.kw.map(x=>'<span class="badge">'+x+'</span>').join('')+'<br><b>태그:</b> '+l.tg.map(x=>'<span class="badge">'+x+'</span>').join('')+'<br><br>'+l.top.map(x=>x.title+' · '+n(x.views)).join('<br>')}function meta(){let c=channel.value,t=topic.value.trim()||'이번 영상',d=DEF[c],l=R(K('learning'),{})[c],kw=l?.kw?.find(x=>!t.includes(x));title.value=(t+' '+d[0]+(kw?' | '+kw:'')).slice(0,100);desc.value=t+' 관련 핵심 내용을 정리했습니다.\n\n'+d[1];tags.value=[...new Set([...(t.match(/[가-힣A-Za-z0-9]+/g)||[]),...(l?.tg||[]),...d[2].split(',')])].slice(0,30).join(', ');cat.value=d[3]}function events(){return R(K('events'),[])}function makeEvent(){if(!title.value.trim())return alert('제목을 입력하세요.'),null;return{id:Date.now(),channel:channel.value,date:date.value,time:time.value,title:title.value,desc:desc.value,tags:tags.value,privacy:privacy.value,cat:cat.value,status:'scheduled'}}function saveLocal(){let e=makeEvent();if(!e)return;let a=events();a.push(e);W(K('events'),a);renderCal();setStatus('캘린더 저장 완료','ok')}async function upload(){if(!token)return alert('YouTube 연결 필요');let f=video.files[0];if(!f)return alert('영상 선택');let e=makeEvent();if(!e)return;let s={selfDeclaredMadeForKids:false};if(e.privacy==='scheduled'){let d=new Date(e.date+'T'+e.time+':00');if(d.getTime()<Date.now()+60000)return alert('예약시간을 확인하세요.');s.privacyStatus='private';s.publishAt=d.toISOString()}else s.privacyStatus=e.privacy;let md={snippet:{title:e.title,description:e.desc,tags:e.tags.split(',').map(x=>x.trim()).filter(Boolean),categoryId:e.cat},status:s},bd='hamom'+Date.now(),body=new Blob(['--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(md)+'\r\n--'+bd+'\r\nContent-Type: '+(f.type||'application/octet-stream')+'\r\n\r\n',f,'\r\n--'+bd+'--']);prog.textContent='업로드 중…';try{let j=await api('https://www.googleapis.com/upload/youtube/v3/videos?part=snippet,status&uploadType=multipart',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body});e.youtubeId=j.id;let a=events();a.push(e);W(K('events'),a);let th=thumb.files[0];if(th){try{await api('https://www.googleapis.com/upload/youtube/v3/thumbnails/set?videoId='+j.id,{method:'POST',headers:{'Content-Type':th.type||'image/jpeg'},body:th})}catch{}}renderCal();prog.textContent='완료: '+j.id;setStatus('YouTube 업로드 완료','ok')}catch(x){setStatus('업로드 실패: '+x.message,'err')}}function renderCal(){cal.innerHTML='';['일','월','화','수','목','금','토'].forEach(x=>{let d=document.createElement('div');d.className='dn';d.textContent=x;cal.appendChild(d)});let y=viewDate.getFullYear(),m=viewDate.getMonth();mt.textContent=y+'년 '+(m+1)+'월';let f=new Date(y,m,1),s=new Date(y,m,1-f.getDay()),a=events().filter(x=>x.channel===active);ec.textContent=a.length;for(let i=0;i<42;i++){let d=new Date(s);d.setDate(s.getDate()+i);let z=ds(d),b=document.createElement('div');b.className='day';b.innerHTML='<b>'+d.getDate()+'</b>';b.onclick=()=>date.value=z;a.filter(x=>x.date===z).forEach(e=>{let q=document.createElement('div');q.className='ev';q.textContent=e.time+' '+e.title;b.appendChild(q)});cal.appendChild(b)}}function mv(x){viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()+x,1);renderCal()}function today(){viewDate=new Date();renderCal()}function backup(){let p={cid:localStorage.getItem(K('cid'))||'',events:events(),learning:R(K('learning'),{})},b=new Blob([JSON.stringify(p,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='HAMOM_backup.json';a.click()}function restoreData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let p=JSON.parse(r.result);if(p.cid){localStorage.setItem(K('cid'),p.cid);cid.value=p.cid}if(p.events)W(K('events'),p.events);if(p.learning)W(K('learning'),p.learning);renderCal();renderLearning();setStatus('복원 완료','ok')};r.readAsText(f)}function ds(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function n(x){return Number(x||0).toLocaleString('ko-KR')}window.addEventListener('load',init)</script></body></html>
